version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    # ❌ NO exponer puertos en producción
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: waitress-serve --port=8000 SEINSERP.wsgi:application
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: SEINSERP.settings.prod
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde el host
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:

networks:
  backend:
    driver: bridge

